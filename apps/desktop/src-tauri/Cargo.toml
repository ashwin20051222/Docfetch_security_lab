[package]
name = "docfetch"
version = "0.1.0"
description = "DocFetch Security Lab — document retrieval and authorized security testing"
authors = ["DocFetch Security Lab"]
edition = "2021"

[lib]
name = "docfetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"