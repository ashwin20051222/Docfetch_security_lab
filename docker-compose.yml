services:
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://docfetch:docfetch@db:5432/docfetch
      DATA_DIR: /data
      AUTHORIZED_LAB_TARGETS: http://host.docker.internal:9101,http://host.docker.internal:9102,http://host.docker.internal:9103
      APP_ENV: development
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - docfetch-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docfetch
      POSTGRES_PASSWORD: docfetch
      POSTGRES_DB: docfetch
    ports:
      - "5432:5432"
    volumes:
      - docfetch-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docfetch"]
      interval: 2s
      timeout: 3s
      retries: 20

  lab-secure-paywall:
    build:
      context: ./lab-target
      dockerfile: secure-paywall/Dockerfile
    ports:
      - "9101:9101"

  lab-weak-client-paywall:
    build:
      context: ./lab-target
      dockerfile: weak-client-paywall/Dockerfile
    ports:
      - "9102:9102"

  lab-weak-direct-file:
    build:
      context: ./lab-target
      dockerfile: weak-direct-file/Dockerfile
    ports:
      - "9103:9103"

volumes:
  docfetch-data:
  docfetch-pg: