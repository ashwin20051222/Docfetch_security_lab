name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Package tests (vitest)
        run: npm run test --workspace @docfetch/document-engine
      - name: Build web
        run: npm run build --workspace @docfetch/web

  integration:
    name: Integration smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install backend deps
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          python -m uvicorn app.main:app --help >/dev/null
      - name: Install frontend deps
        run: npm ci
      - name: Build web (vitest + vite)
        run: npm run build --workspace @docfetch/web
      - name: Run integration
        run: bash tests/integration/run.sh